<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>F1 Travel Vis</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<script src="./libs/d3.js"></script>
	<script src="libs/d3jstopojson.v1.js"></script>
	<script src="script.js" defer></script>
	<link rel="stylesheet" href="style.css"/>
</head>
	
<body>
	<div class="container">
		<h2>Formula 1 Travel Visualizer</h2>
	</div>

	<!---- YEAR SELECTOR ---->
	
	<div class="container">	
		<label for="year">Select Year:</label>
		<select id="year" onchange="updateYear()"></select>

		<script>
		const startYear = 2025;
		const endYear = 1950;
		const select = document.getElementById('year');

		// Add a placeholder option
		const placeholder = document.createElement('option');
		placeholder.value = "";
		placeholder.textContent = "--Choose a year--";
		select.appendChild(placeholder);

		// Populate the dropdown
		for (let y = startYear; y >= endYear; y--) {
			const option = document.createElement('option');
			option.value = y;
			option.textContent = y;
			select.appendChild(option);
		}
		</script>
	</div>

	<div class="row"> <!-- HOUSES TWO VISUALIZATIONS SIDE BY SIDE -->

		<!-- TRAVEL MAP PROJECTION -->
		<div class="container half">
			<h3> Race Travel Map </h3>
			<div class="wrap">
				<div class="map-card">
					<div id="map" class="map-container"></div>

					<div class="controls">
						<button id="reset" class="btn">Reset zoom</button>
						<button id="zoom-in" class="btn secondary">Zoom in</button>
						<button id="zoom-out" class="btn secondary">Zoom out</button>
					</div>

					<div class="foot">Projection: <strong>Mercator</strong>.</div>
				</div>
			</div>
		</div>

		<!-- TRAVEL DATA BAR CHARTS -->
		<div class="container half">
			<h3> Inter-Race Travel Distances </h3>
			<div class="wrap">
				<div class="map-card">
					<div id="travel-chart" class="chart-container"></div>
				</div>
			</div>
		</div>

	</div>

	<div class="container"> <!-- HOUSES THIRD VISUALIZATION -->
		<h3> Distance travelled within vs outside races </h3>
		<div id="bar">
		</div>
	</div>
</body>

	<script src="linechart.js" defer></script>
	<script src="stackedbar.js" defer></script>

</html>
